<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" role="img" aria-label="A stream is a feed of cards where new content pushes the old content out. A garden is a network of notes where new notes attach to existing ones.">
  <g font-family="Georgia, 'Times New Roman', serif" text-anchor="middle" fill="#8a8a8a">
    <!-- Stream -->
    <g fill="none" stroke="#8a8a8a" stroke-width="1.5">
      <rect x="120" y="15" width="120" height="34" rx="6"/>
      <rect x="120" y="60" width="120" height="34" rx="6" opacity="0.55"/>
      <rect x="120" y="105" width="120" height="34" rx="6" opacity="0.25"/>
      <line x1="275" y1="20" x2="275" y2="132"/>
    </g>
    <polygon points="268,128 282,128 275,142" fill="#8a8a8a" stroke="none"/>
    <text x="180" y="182" font-size="20" style="fill:#8a8a8a">Stream</text>
    <text x="180" y="204" font-size="14" opacity="0.8">new pushes old away</text>

    <line x1="360" y1="20" x2="360" y2="200" stroke="#8a8a8a" stroke-width="1" opacity="0.3"/>

    <!-- Garden -->
    <g stroke="#8a8a8a" stroke-width="1.5">
      <line x1="470" y1="55" x2="530" y2="35"/>
      <line x1="530" y1="35" x2="590" y2="65"/>
      <line x1="590" y1="65" x2="560" y2="115"/>
      <line x1="560" y1="115" x2="500" y2="105"/>
      <line x1="500" y1="105" x2="470" y2="55"/>
      <line x1="530" y1="75" x2="470" y2="55"/>
      <line x1="530" y1="75" x2="590" y2="65"/>
      <line x1="530" y1="75" x2="560" y2="115"/>
    </g>
    <g stroke="#5a9a6e" stroke-width="1.5" stroke-dasharray="5 4">
      <line x1="590" y1="65" x2="650" y2="40"/>
      <line x1="560" y1="115" x2="625" y2="130"/>
      <line x1="500" y1="105" x2="450" y2="135"/>
    </g>
    <g fill="#8a8a8a" stroke="none">
      <circle cx="470" cy="55" r="7"/><circle cx="530" cy="35" r="7"/><circle cx="590" cy="65" r="7"/>
      <circle cx="560" cy="115" r="7"/><circle cx="500" cy="105" r="7"/><circle cx="530" cy="75" r="7"/>
    </g>
    <g fill="#5a9a6e" stroke="none">
      <circle cx="650" cy="40" r="7"/><circle cx="625" cy="130" r="7"/><circle cx="450" cy="135" r="7"/>
    </g>
    <text x="540" y="182" font-size="20" style="fill:#8a8a8a">Garden</text>
    <text x="540" y="204" font-size="14" opacity="0.8">new grows from existing</text>
  </g>
</svg>
