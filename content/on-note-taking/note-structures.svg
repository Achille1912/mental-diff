<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" role="img" aria-label="Atomic notes are a web of small linked notes, a monolithic note is one big note, a MOC is an index note linking several notes.">
  <g font-family="Georgia, 'Times New Roman', serif" text-anchor="middle" fill="#8a8a8a">
    <!-- Atomic -->
    <g stroke="#8a8a8a" stroke-width="1.5">
      <line x1="70" y1="45" x2="140" y2="35"/>
      <line x1="140" y1="35" x2="185" y2="85"/>
      <line x1="185" y1="85" x2="135" y2="115"/>
      <line x1="135" y1="115" x2="65" y2="100"/>
      <line x1="65" y1="100" x2="70" y2="45"/>
      <line x1="120" y1="75" x2="70" y2="45"/>
      <line x1="120" y1="75" x2="185" y2="85"/>
      <line x1="120" y1="75" x2="135" y2="115"/>
    </g>
    <g stroke="none">
      <circle cx="70" cy="45" r="7"/><circle cx="140" cy="35" r="7"/><circle cx="185" cy="85" r="7"/>
      <circle cx="135" cy="115" r="7"/><circle cx="65" cy="100" r="7"/><circle cx="120" cy="75" r="7"/>
    </g>
    <text x="120" y="182" font-size="20" fill="currentColor" style="fill:#8a8a8a">Atomic</text>
    <text x="120" y="204" font-size="14" opacity="0.8">one concept per note</text>

    <!-- Monolithic -->
    <rect x="250" y="20" width="220" height="120" rx="8" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
    <g stroke="#8a8a8a" stroke-width="2" stroke-linecap="round" opacity="0.7">
      <line x1="272" y1="46" x2="448" y2="46"/>
      <line x1="272" y1="64" x2="420" y2="64"/>
      <line x1="272" y1="82" x2="448" y2="82"/>
      <line x1="272" y1="100" x2="395" y2="100"/>
      <line x1="272" y1="118" x2="435" y2="118"/>
    </g>
    <text x="360" y="182" font-size="20" style="fill:#8a8a8a">Monolithic</text>
    <text x="360" y="204" font-size="14" opacity="0.8">one big note per subject</text>

    <!-- MOC -->
    <g stroke="#5a9a6e" stroke-width="1.5">
      <line x1="600" y1="80" x2="540" y2="30"/>
      <line x1="600" y1="80" x2="660" y2="30"/>
      <line x1="600" y1="80" x2="540" y2="130"/>
      <line x1="600" y1="80" x2="660" y2="130"/>
    </g>
    <circle cx="600" cy="80" r="15" fill="#5a9a6e"/>
    <g fill="#8a8a8a">
      <circle cx="540" cy="30" r="9"/><circle cx="660" cy="30" r="9"/>
      <circle cx="540" cy="130" r="9"/><circle cx="660" cy="130" r="9"/>
    </g>
    <text x="600" y="182" font-size="20" style="fill:#8a8a8a">MOC</text>
    <text x="600" y="204" font-size="14" opacity="0.8">an index linking the notes</text>
  </g>
</svg>
