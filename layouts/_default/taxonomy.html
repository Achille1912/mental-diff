{{ define "title" }}Tags — {{ site.Title }}{{ end }}

{{ define "main" }}
  <main>
    {{ if .Data.Terms.Alphabetical }}
      <ul class="post-list">
        {{ range .Data.Terms.Alphabetical }}
          <li>
            <a href="{{ .Page.RelPermalink }}">{{ .Page.Data.Term }}</a>
            <span class="post-date">{{ .Count }}</span>
          </li>
        {{ end }}
      </ul>
    {{ else }}
      <p class="secondary">No tags yet.</p>
    {{ end }}

    <p style="margin-top:1.5rem">
      <a href="{{ .Site.Home.RelPermalink }}">← all posts</a>
    </p>
  </main>
{{ end }}
