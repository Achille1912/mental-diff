baseURL = "https://mentaldiff.achillecannavale.dev/"
languageCode = "it"
title = "Mental Diff"
enableRobotsTXT = true

[taxonomies]
  tag = "tags"

# Il sito portfolio è un repository separato.
[params]
  portfolioURL = "https://achillecannavale.dev/"

[outputs]
  home = ["HTML", "RSS", "JSON"]

[markup.goldmark.renderer]
  unsafe = true

# Lascia passare la matematica LaTeX così com'è (niente parsing markdown
# dentro $...$ o $$...$$): il rendering vero lo fa KaTeX lato client,
# vedi layouts/_default/single.html.
[markup.goldmark.extensions.passthrough]
  enable = true
  [markup.goldmark.extensions.passthrough.delimiters]
    block = [["\\[", "\\]"], ["$$", "$$"]]
    inline = [["\\(", "\\)"], ["$", "$"]]

# Evidenziazione a classi: i colori li decide style.css, non stili inline di Chroma.
[markup.highlight]
  noClasses = false
  lineNos = false
  guessSyntax = true

# Serve per .Lastmod (usato in <atom:updated> nel feed RSS): prende la data
# dell'ultimo commit git che ha toccato il file, non il mtime del filesystem
# (che il checkout di GitHub Actions azzera per tutti i file ad ogni build).
enableGitInfo = true
